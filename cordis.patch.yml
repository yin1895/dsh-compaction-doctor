# ─────────────────────────────────────────────────────────────────────────────
# @local/dsh-compaction-doctor — bundle patch (v0.2)
#
# Layering: this patch is applied after the shipped bundle stack, so overriding a
# shipped row by id wins over its own defaults, and the profile's own
# `cordis.patch.yml` still wins over this file. A patch replaces a row's whole
# `config` (never merges into it), and `name` is an assertion: a mismatched name
# makes the whole row be skipped instead of remounted.
# ─────────────────────────────────────────────────────────────────────────────

# Disable the shipped compaction backend so exactly one service mounts as
# `ctx.compaction`. The doctor engine extends `BasicCompactionEngine`, so the
# class stays importable while its own row is off.
- id: compaction-basic
  name: '@deepseek-ai/dsh-compaction-basic'
  disabled: true

- insert:
    # ── the browser half's discovery row ─────────────────────────────────────
    # `dsh-client-modules` resolves a Loader row to its package through
    # `exactPackageSpecifier()` (`dsh-client-modules/lib/index.js:83-89`), which
    # returns undefined for a SUBPATH specifier. A package that declares
    # `dsh.client` but is mounted only via `<name>/probe` / `<name>/engine` is
    # therefore never registered as a browser module: `/plugins/<name>/client.js`
    # 404s and none of its settings UI appears. This row gives the package its
    # bare-name entry; `lib/index.js` is a deliberate no-op host half. Every
    # client-half plugin on this machine does the same.
    - id: compaction-doctor-client
      name: '@local/dsh-compaction-doctor'

    # Upstream capability probe + settings-page transport + diagnostic report.
    #
    # This row's Config is marked `.volatile()`, which is what makes it a
    # settings namespace: the browser reads and writes these fields through
    # `ctx.configForms.get('compaction-doctor')` with no registration step.
    # `writeConfig` defaults to false on purpose — a discovered value is only
    # written when the user presses 「一键修复」, never on startup.
    - id: compaction-doctor
      name: '@local/dsh-compaction-doctor/probe'
      config:
        enabled: true
        # Fallback route for a brand-new session; a live `request/context` wins.
        provider: huaiyuan
        model: DeepSeek-V4.1-Flash
        providerEntryId: llm-pi-ai
        engineEntryId: compaction-doctor-engine
        probeOnStart: true
        writeConfig: false
        overflowRecovery: true
        capMaxTokens: 65536
        activeProbe: false
        activeProbeConfirm: false
        tokensPerByte: 0.34
        scaleMode: meter
        maxSummaryChunks: 8
        summaryBudgetRatio: 0.9
        selectCapRatio: 0.85
        writeWhenBusy: false

    # Compaction engine: real-scale retention pricing + chunked hierarchical
    # summarization + overflow classification for provider errors the harness
    # does not decode. Policy keys here are consumed and frozen by the shipped
    # base class, so they change only by rewriting this row (which hot-reloads).
    - id: compaction-doctor-engine
      name: '@local/dsh-compaction-doctor/engine'
      config:
        auto: true
        thresholdRatio: 0.75
        headroomTokens: 65536
        retainRatio: 0.05
        maxTokens: 65536
        compactionRetries: 2
        maxOverflowRetries: 2